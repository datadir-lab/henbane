policies:
  - type: commit
    spec:
      header:
        length: 72
        imperative: false
        case: lower
      conventional:
        types:
          - feat
          - fix
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert
        scopes:
          - '[a-z0-9/-]+'
        descriptionLength: 72
