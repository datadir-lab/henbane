version: 2
updates:
  # Go modules — kept minimal by the zero-third-party-dep policy, but watch the
  # Go directive and the single allowlisted dependency (gopkg.in/yaml.v3).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 5

  # Caddy plugin — a SEPARATE Go module (so Caddy's large dependency tree never
  # touches the zero-dep core). Watched on its own module so its transitive deps
  # (OpenTelemetry, the smallstep/Caddy PKI stack, compression, etc.) stay
  # current instead of only moving on security-alert-driven updates.
  - package-ecosystem: gomod
    directory: "/caddy"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 10

  # Container base images (Dockerfile) — keeps the digest-pinned golang and
  # distroless bases current.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 5

  # GitHub Actions are pinned to commit SHAs in the workflows; Dependabot proposes
  # SHA bumps (updating the trailing version comment too).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
