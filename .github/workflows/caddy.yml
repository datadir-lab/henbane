# The Caddy plugin is a SEPARATE Go module (caddy/go.mod) so Caddy's large
# dependency tree never touches the zero-dependency main module. It is built here
# only when the plugin or the parent public API it depends on changes, so the
# heavy Caddy download stays off the main CI path.
#
# Third-party actions are pinned to immutable commit SHAs (with a trailing version
# comment); Dependabot (github-actions ecosystem) proposes SHA bumps.
name: caddy
on:
  push:
    branches: [main]
    paths: [caddy/**, henbane.go, go.mod, .github/workflows/caddy.yml]
  pull_request:
    paths: [caddy/**, henbane.go, go.mod, .github/workflows/caddy.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: caddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
