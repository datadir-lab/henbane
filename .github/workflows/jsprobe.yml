# The jsprobe device/behavioural fingerprinting plugin is a SEPARATE Go module
# (jsprobe/go.mod) because what it does, fingerprinting a visitor's browser, is exactly
# the surveillance the zero-dependency core refuses. Keeping it in its own module makes a
# core build provably incapable of it; an operator opts in by running henbane-surveil.
# It plugs into the public henbane.WithChallenger seam and reuses the tlsfp package for
# JA4 on TLS, so it is rebuilt when those change. It imports only the standard library.
#
# Third-party actions are pinned to immutable commit SHAs (with a trailing version
# comment); Dependabot (github-actions ecosystem) proposes SHA bumps.
name: jsprobe
on:
  push:
    branches: [main]
    paths: [jsprobe/**, tlsfp/**, henbane.go, go.mod, .github/workflows/jsprobe.yml]
  pull_request:
    paths: [jsprobe/**, tlsfp/**, henbane.go, go.mod, .github/workflows/jsprobe.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jsprobe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
