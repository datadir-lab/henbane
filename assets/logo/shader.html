<!doctype html>
<meta charset="utf-8">
<title>henbane · shader forge</title>
<style>
  :root{--bg:#0e0d0b;--panel:#17150f;--line:#2b2820;--ink:#e9e3d4;--mut:#8a8172;--acc:#c9b53f;
        --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px var(--mono);display:flex;height:100vh;overflow:hidden}
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative}
  #wrap{position:relative;border-radius:6px;overflow:hidden}
  #wrap.paper{background:#f4f1ea}
  #wrap.night{background:#14120f}
  #wrap.checker{background:
    conic-gradient(#3a372e 90deg,#2a2821 0 180deg,#3a372e 0 270deg,#2a2821 0) 0 0/24px 24px}
  canvas{display:block}
  #bgrow{display:flex;gap:8px;align-items:center;color:var(--mut)}
  #bgrow button{font:12px var(--mono)}
  .hint{color:var(--mut);font-size:11px;max-width:620px;text-align:center;line-height:1.5}
  #panel{width:330px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px 16px 60px}
  #panel h1{font-size:14px;margin:0 0 2px;letter-spacing:.04em}
  #panel .sub{color:var(--mut);font-size:11px;margin-bottom:14px}
  .grp{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
  .grp>.t{color:var(--acc);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px}
  label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;color:var(--ink)}
  label span.k{color:var(--mut);white-space:nowrap}
  label span.v{color:var(--ink);min-width:40px;text-align:right}
  input[type=range]{flex:1;accent-color:var(--acc)}
  select,button{background:#211e17;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:12px var(--mono)}
  button{cursor:pointer}
  button:hover{border-color:var(--acc)}
  .modes,.pals{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .modes button,.pals button{text-align:center}
  .modes button.on,.pals button.on{background:var(--acc);color:#14120f;border-color:var(--acc);font-weight:700}
  input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  #exportbar{display:flex;gap:8px;margin-top:4px}
  #dl{background:var(--acc);color:#14120f;border-color:var(--acc);font-weight:700;flex:2}
</style>
<body>
  <div id="stage">
    <div id="wrap" class="paper"><canvas id="c" width="600" height="600"></canvas></div>
    <div id="bgrow">
      preview bg:
      <button data-bg="paper">paper</button>
      <button data-bg="night">night</button>
      <button data-bg="checker">transparent</button>
      <span style="margin-left:14px">· drag = pan · wheel = zoom</span>
    </div>
    <div class="hint">Public-domain <i>Hyoscyamus niger</i> plates (Köhler 1887, 1794, Bentley–Trimen, Sturm) driven through GLSL. Crop into the flower, pick a style + palette, export PNG.</div>
  </div>

  <div id="panel">
    <h1>henbane · shader forge</h1>
    <div class="sub">image → shader → mark</div>

    <div class="grp">
      <div class="t">Source</div>
      <select id="src"></select>
      <label><span class="k">zoom</span><input id="zoom" type="range" min="0.4" max="6" step="0.01" value="1"><span class="v" id="zoomv">1.00</span></label>
      <button id="reset" style="width:100%;margin-top:4px">reset crop</button>
    </div>

    <div class="grp">
      <div class="t">Tone</div>
      <label><span class="k">invert</span><input id="invert" type="checkbox"></label>
      <label><span class="k">black</span><input id="black" type="range" min="0" max="1" step="0.01" value="0.05"><span class="v" id="blackv">.05</span></label>
      <label><span class="k">white</span><input id="white" type="range" min="0" max="1" step="0.01" value="0.95"><span class="v" id="whitev">.95</span></label>
      <label><span class="k">gamma</span><input id="gamma" type="range" min="0.2" max="3" step="0.01" value="1"><span class="v" id="gammav">1.0</span></label>
    </div>

    <div class="grp">
      <div class="t">Style</div>
      <div class="modes" id="modes">
        <button data-m="0">grayscale</button>
        <button data-m="1" class="on">threshold</button>
        <button data-m="2">posterize</button>
        <button data-m="3">halftone</button>
        <button data-m="4">engraving</button>
        <button data-m="5">dither</button>
      </div>
      <div id="mparams" style="margin-top:9px"></div>
    </div>

    <div class="grp">
      <div class="t">Palette</div>
      <div class="pals" id="pals"></div>
      <label style="margin-top:8px"><span class="k">background</span>
        <select id="bgmode"><option value="transparent">transparent (ink only)</option><option value="paper" selected>paper fill</option></select></label>
      <div class="row" style="margin-top:6px">
        <label><span class="k">ink</span><input id="ink" type="color" value="#14120f"></label>
        <label><span class="k">paper</span><input id="paper" type="color" value="#f4f1ea"></label>
      </div>
      <label><span class="k">3-tone ramp</span><input id="ramp3" type="checkbox"></label>
      <label id="midrow" style="display:none"><span class="k">mid</span><input id="mid" type="color" value="#7a2f2a"></label>
    </div>

    <div class="grp">
      <div class="t">Mask</div>
      <div class="modes">
        <button data-mask="0" class="on">none</button>
        <button data-mask="1">circle</button>
        <button data-mask="2">rounded</button>
      </div>
      <label style="margin-top:8px"><span class="k">padding</span><input id="pad" type="range" min="0" max="0.3" step="0.005" value="0.06"><span class="v" id="padv">.06</span></label>
    </div>

    <div class="grp">
      <div class="t">Frame / border</div>
      <div class="modes">
        <button data-frame="0">none</button>
        <button data-frame="1">square</button>
        <button data-frame="2" class="on">double</button>
        <button data-frame="3">ring</button>
      </div>
      <label style="margin-top:8px"><span class="k">margin</span><input id="fmargin" type="range" min="0.02" max="0.22" step="0.005" value="0.10"><span class="v" id="fmarginv">.10</span></label>
      <label><span class="k">line w</span><input id="flinew" type="range" min="0.004" max="0.03" step="0.001" value="0.012"><span class="v" id="flinewv">.012</span></label>
    </div>

    <div class="grp">
      <div class="t">Export</div>
      <div id="exportbar">
        <select id="exsize"><option>256</option><option selected>512</option><option>1024</option><option>2048</option></select>
        <button id="dl">download png</button>
      </div>
    </div>
  </div>

  <script src="src/images.js?v=2"></script>
  <script>
  const VERT=`attribute vec2 aPos; varying vec2 vUv;
    void main(){ vUv=aPos*0.5+0.5; gl_Position=vec4(aPos,0.0,1.0);} `;
  const FRAG=`precision highp float;
  varying vec2 vUv;
  uniform sampler2D uTex; uniform vec2 uTexSize; uniform vec2 uRes;
  uniform float uZoom; uniform vec2 uPan;
  uniform float uInvert, uBlack, uWhite, uGamma;
  uniform int uMode;
  uniform float uThresh, uSoft;     // threshold
  uniform float uSteps;             // posterize
  uniform float uCell, uAngle;      // halftone
  uniform float uHSpace, uHAngle, uHWidth; // engraving
  uniform float uDScale;            // dither
  uniform vec3 uInk, uPaper, uMid;  uniform float uRamp3; uniform float uPaperOn;
  uniform int uMask; uniform float uPad;
  uniform int uFrame; uniform float uFrameMargin, uFrameLineW;
  const float PI=3.14159265;

  float luma(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }
  mat2 rot(float a){ return mat2(cos(a),-sin(a),sin(a),cos(a)); }

  float bayer4(vec2 c){
    vec2 p=floor(mod(c,4.0)); float i=p.y*4.0+p.x; float m=0.0;
    if(i<0.5)m=0.0; else if(i<1.5)m=8.0; else if(i<2.5)m=2.0; else if(i<3.5)m=10.0;
    else if(i<4.5)m=12.0; else if(i<5.5)m=4.0; else if(i<6.5)m=14.0; else if(i<7.5)m=6.0;
    else if(i<8.5)m=3.0; else if(i<9.5)m=11.0; else if(i<10.5)m=1.0; else if(i<11.5)m=9.0;
    else if(i<12.5)m=15.0; else if(i<13.5)m=7.0; else if(i<14.5)m=13.0; else m=5.0;
    return (m+0.5)/16.0;
  }
  float line(float coord,float sp,float w){ // 0 on the ink line, 1 between
    return step(w, mod(coord, sp));
  }

  void main(){
    // ---- crop (cover into square-ish canvas) ----
    float a = uTexSize.x/uTexSize.y;
    vec2 c = (vUv-0.5)/uZoom + uPan;
    if(a>1.0) c.x *= a; else c.y /= a;
    vec2 uv = c+0.5;
    bool outside = uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0;

    float l;
    if(outside){ l=1.0; }
    else {
      vec3 src=texture2D(uTex, uv).rgb;
      l=luma(src);
      if(uInvert>0.5) l=1.0-l;
      l=clamp((l-uBlack)/max(0.001,(uWhite-uBlack)),0.0,1.0);
      l=pow(l, 1.0/uGamma);
    }

    // ---- style → v (0 ink .. 1 paper) ----
    float v=l;
    vec2 fc=gl_FragCoord.xy;
    if(uMode==1){ v=smoothstep(uThresh-uSoft, uThresh+uSoft, l); }
    else if(uMode==2){ v=floor(l*uSteps+0.5)/uSteps; }
    else if(uMode==3){
      vec2 rc=rot(uAngle)*fc;
      vec2 g=mod(rc,uCell)-uCell*0.5;
      float d=length(g);
      float r=sqrt(clamp(1.0-l,0.0,1.0))*uCell*0.72;
      v=smoothstep(r-1.0, r+1.0, d);
    }
    else if(uMode==4){
      v=1.0;
      float p0=dot(fc, vec2(cos(uHAngle),sin(uHAngle)));
      float p1=dot(fc, vec2(cos(uHAngle+PI*0.5),sin(uHAngle+PI*0.5)));
      float p2=dot(fc, vec2(cos(uHAngle+PI*0.25),sin(uHAngle+PI*0.25)));
      float p3=dot(fc, vec2(cos(uHAngle-PI*0.25),sin(uHAngle-PI*0.25)));
      if(l<0.86) v=min(v, line(p0,uHSpace,uHWidth));
      if(l<0.66) v=min(v, line(p1,uHSpace,uHWidth));
      if(l<0.46) v=min(v, line(p2,uHSpace,uHWidth));
      if(l<0.26) v=min(v, line(p3,uHSpace,uHWidth));
      if(l<0.10) v=0.0;
    }
    else if(uMode==5){
      float t=bayer4(fc/uDScale);
      v=step(t, l);
    }

    // ---- color ----
    vec3 col; float alpha;
    if(uPaperOn>0.5){
      if(uRamp3>0.5){
        col = v<0.5 ? mix(uInk,uMid,v*2.0) : mix(uMid,uPaper,(v-0.5)*2.0);
      } else col = mix(uInk, uPaper, v);
      alpha=1.0;
    } else {
      col=uInk; alpha=1.0-v;             // ink on transparent
    }

    // ---- mask ----
    if(uMask>0){
      vec2 m=vUv-0.5;
      float inside;
      if(uMask==1){ inside = step(length(m), 0.5-uPad); }
      else { // rounded square
        vec2 q=abs(m)-(0.5-uPad-0.08);
        float d=length(max(q,0.0))+min(max(q.x,q.y),0.0)-0.08;
        inside = step(d, 0.0);
      }
      alpha*=inside;
    }

    // ---- frame / border ----
    if(uFrame>0){
      float inner = 0.5 - uFrameMargin;
      float dsq = max(abs(vUv.x-0.5), abs(vUv.y-0.5));
      float dci = length(vUv-0.5);
      float d = (uFrame==3) ? dci : dsq;
      if(d > inner){
        col = uPaper; alpha = (uPaperOn>0.5)?1.0:0.0;
        float lw = uFrameLineW*0.5;
        float p1 = 0.5 - uFrameMargin*0.26;
        if(abs(d - p1) < lw){ col=uInk; alpha=1.0; }
        if(uFrame==2){
          float p2 = 0.5 - uFrameMargin*0.62;
          if(abs(d - p2) < lw*0.8){ col=uInk; alpha=1.0; }
        }
      }
    }
    gl_FragColor=vec4(col, alpha);
  }`;

  // ---------- GL setup ----------
  const cv=document.getElementById('c');
  const gl=cv.getContext('webgl',{alpha:true,premultipliedAlpha:false,preserveDrawingBuffer:true,antialias:true});
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
  const prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw gl.getProgramInfoLog(prog);
  gl.useProgram(prog);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
  const aPos=gl.getAttribLocation(prog,'aPos');gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(prog,n);
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

  // ---------- state ----------
  const S={img:null,texSize:[1,1],zoom:1,pan:[0,0],invert:0,black:0.05,white:0.95,gamma:1,
    mode:1,thresh:0.5,soft:0.04,steps:4,cell:8,angle:0.4,hspace:5,hangle:0.4,hwidth:1.3,dscale:2,
    ink:[0.078,0.071,0.059],paper:[0.957,0.945,0.918],mid:[0.48,0.18,0.16],ramp3:0,paperOn:1,
    mask:0,pad:0.06,frame:2,frameMargin:0.10,frameLineW:0.012};
  function hex2rgb(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];}

  const PALS=[
    ['ink / paper','#14120f','#f4f1ea','#7a2f2a',false],
    ['oxblood','#3f1113','#ece0c8','#7a2f2a',false],
    ['sulphur poison','#17160f','#c9b53f','#6e7a1f',false],
    ['toxic green','#05130c','#48f0a0','#0c6b47',true],
    ['bone / night','#efe9dd','#14120f','#8a8172',false],
    ['iris (3-tone)','#2a1140','#efe9dd','#2f8f8a',true],
  ];

  function loadImg(key){
    const im=new Image();
    im.onload=()=>{ S.texSize=[im.naturalWidth,im.naturalHeight];
      gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);
      render(); };
    im.src=HB_IMAGES[key];
  }

  function render(w,h){
    const W=w||cv.width, H=h||cv.height;
    if(cv.width!==W)cv.width=W; if(cv.height!==H)cv.height=H;
    gl.viewport(0,0,W,H);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U('uTexSize'),S.texSize[0],S.texSize[1]);
    gl.uniform2f(U('uRes'),W,H);
    gl.uniform1f(U('uZoom'),S.zoom); gl.uniform2f(U('uPan'),S.pan[0],S.pan[1]);
    gl.uniform1f(U('uInvert'),S.invert); gl.uniform1f(U('uBlack'),S.black);
    gl.uniform1f(U('uWhite'),S.white); gl.uniform1f(U('uGamma'),S.gamma);
    gl.uniform1i(U('uMode'),S.mode);
    gl.uniform1f(U('uThresh'),S.thresh); gl.uniform1f(U('uSoft'),S.soft);
    gl.uniform1f(U('uSteps'),S.steps);
    gl.uniform1f(U('uCell'),S.cell*(W/600)); gl.uniform1f(U('uAngle'),S.angle);
    gl.uniform1f(U('uHSpace'),S.hspace*(W/600)); gl.uniform1f(U('uHAngle'),S.hangle); gl.uniform1f(U('uHWidth'),S.hwidth*(W/600));
    gl.uniform1f(U('uDScale'),S.dscale*(W/600));
    gl.uniform3fv(U('uInk'),S.ink); gl.uniform3fv(U('uPaper'),S.paper); gl.uniform3fv(U('uMid'),S.mid);
    gl.uniform1f(U('uRamp3'),S.ramp3); gl.uniform1f(U('uPaperOn'),S.paperOn);
    gl.uniform1i(U('uMask'),S.mask); gl.uniform1f(U('uPad'),S.pad);
    gl.uniform1i(U('uFrame'),S.frame); gl.uniform1f(U('uFrameMargin'),S.frameMargin); gl.uniform1f(U('uFrameLineW'),S.frameLineW);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  // ---------- UI wiring ----------
  const $=id=>document.getElementById(id);
  // sources
  const srcSel=$('src');
  Object.keys(HB_IMAGES).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;srcSel.appendChild(o);});
  srcSel.value='photo-0003'; srcSel.onchange=()=>{S.pan=[0,0];S.zoom=1;$('zoom').value=1;loadImg(srcSel.value);};

  function bindRange(id,key,fmt){const el=$(id),out=$(id+'v');
    const upd=()=>{S[key]=parseFloat(el.value); if(out)out.textContent=(fmt?fmt(S[key]):S[key]); render();};
    el.oninput=upd; upd();}
  bindRange('zoom','zoom',v=>v.toFixed(2));
  bindRange('black','black',v=>v.toFixed(2).slice(1));
  bindRange('white','white',v=>v.toFixed(2).slice(1));
  bindRange('gamma','gamma',v=>v.toFixed(1));
  bindRange('pad','pad',v=>v.toFixed(2).slice(1));
  $('invert').onchange=e=>{S.invert=e.target.checked?1:0;render();};
  $('reset').onclick=()=>{S.pan=[0,0];S.zoom=1;$('zoom').value=1;$('zoomv').textContent='1.00';render();};

  // mode params
  const MP={
    0:'',
    1:`<label><span class="k">threshold</span><input id="thresh" type="range" min="0" max="1" step="0.01" value="0.5"><span class="v" id="threshv">.50</span></label>
       <label><span class="k">softness</span><input id="soft" type="range" min="0" max="0.3" step="0.005" value="0.04"><span class="v" id="softv">.04</span></label>`,
    2:`<label><span class="k">levels</span><input id="steps" type="range" min="2" max="8" step="1" value="4"><span class="v" id="stepsv">4</span></label>`,
    3:`<label><span class="k">cell px</span><input id="cell" type="range" min="3" max="22" step="0.5" value="8"><span class="v" id="cellv">8</span></label>
       <label><span class="k">angle</span><input id="angle" type="range" min="0" max="1.57" step="0.01" value="0.4"><span class="v" id="anglev">.4</span></label>`,
    4:`<label><span class="k">spacing</span><input id="hspace" type="range" min="3" max="14" step="0.5" value="5"><span class="v" id="hspacev">5</span></label>
       <label><span class="k">angle</span><input id="hangle" type="range" min="0" max="1.57" step="0.01" value="0.4"><span class="v" id="hanglev">.4</span></label>
       <label><span class="k">line w</span><input id="hwidth" type="range" min="0.5" max="3" step="0.1" value="1.3"><span class="v" id="hwidthv">1.3</span></label>`,
    5:`<label><span class="k">scale</span><input id="dscale" type="range" min="1" max="5" step="0.5" value="2"><span class="v" id="dscalev">2</span></label>`,
  };
  function buildMParams(){
    $('mparams').innerHTML=MP[S.mode];
    const b=(id,key,fmt)=>{const el=$(id); if(!el)return; const out=$(id+'v');
      const upd=()=>{S[key]=parseFloat(el.value); if(out)out.textContent=(fmt?fmt(S[key]):S[key]); render();}; el.oninput=upd; upd();};
    b('thresh','thresh',v=>v.toFixed(2).slice(1)); b('soft','soft',v=>v.toFixed(3).slice(1));
    b('steps','steps'); b('cell','cell'); b('angle','angle',v=>v.toFixed(2).slice(1));
    b('hspace','hspace'); b('hangle','hangle',v=>v.toFixed(2).slice(1)); b('hwidth','hwidth',v=>v.toFixed(1));
    b('dscale','dscale');
  }
  document.querySelectorAll('#modes button').forEach(btn=>btn.onclick=()=>{
    document.querySelectorAll('#modes button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); S.mode=parseInt(btn.dataset.m); buildMParams(); render();});
  buildMParams();

  // palettes
  const pals=$('pals');
  PALS.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p[0];
    b.onclick=()=>{S.ink=hex2rgb(p[1]);S.paper=hex2rgb(p[2]);S.mid=hex2rgb(p[3]);
      S.ramp3=p[4]?1:0; $('ramp3').checked=p[4]; $('midrow').style.display=p[4]?'flex':'none';
      $('ink').value=p[1];$('paper').value=p[2];$('mid').value=p[3];
      document.querySelectorAll('#pals button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};
    pals.appendChild(b); if(i===0)b.classList.add('on');});
  $('ink').oninput=e=>{S.ink=hex2rgb(e.target.value);render();};
  $('paper').oninput=e=>{S.paper=hex2rgb(e.target.value);render();};
  $('mid').oninput=e=>{S.mid=hex2rgb(e.target.value);render();};
  $('ramp3').onchange=e=>{S.ramp3=e.target.checked?1:0;$('midrow').style.display=e.target.checked?'flex':'none';render();};
  $('bgmode').onchange=e=>{S.paperOn=e.target.value==='paper'?1:0;render();};

  // mask
  document.querySelectorAll('[data-mask]').forEach(btn=>btn.onclick=()=>{
    document.querySelectorAll('[data-mask]').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); S.mask=parseInt(btn.dataset.mask); render();});

  // frame
  document.querySelectorAll('[data-frame]').forEach(btn=>btn.onclick=()=>{
    document.querySelectorAll('[data-frame]').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); S.frame=parseInt(btn.dataset.frame); render();});
  bindRange('fmargin','frameMargin',v=>v.toFixed(2).slice(1));
  bindRange('flinew','frameLineW',v=>v.toFixed(3).slice(1));

  // preview bg
  document.querySelectorAll('[data-bg]').forEach(btn=>btn.onclick=()=>{
    $('wrap').className=btn.dataset.bg;});

  // pan/zoom interaction
  let drag=false,lx=0,ly=0;
  cv.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
  window.addEventListener('mouseup',()=>drag=false);
  window.addEventListener('mousemove',e=>{if(!drag)return;
    const dx=(e.clientX-lx)/cv.clientWidth, dy=(e.clientY-ly)/cv.clientHeight;
    S.pan[0]-=dx/S.zoom; S.pan[1]+=dy/S.zoom; lx=e.clientX;ly=e.clientY;render();});
  cv.addEventListener('wheel',e=>{e.preventDefault();
    S.zoom=Math.max(0.4,Math.min(6,S.zoom*(e.deltaY<0?1.08:0.926)));
    $('zoom').value=S.zoom;$('zoomv').textContent=S.zoom.toFixed(2);render();},{passive:false});

  // export
  $('dl').onclick=()=>{
    const sz=parseInt($('exsize').value);
    const ow=cv.width,oh=cv.height;
    render(sz,sz);
    const url=cv.toDataURL('image/png');
    const a=document.createElement('a');a.href=url;
    a.download=`henbane-${srcSel.value}-m${S.mode}-${sz}.png`;a.click();
    render(ow,oh);
  };

  loadImg('photo-0003');
  </script>
</body>
