version: 2

project_name: henbane

before:
  hooks:
    - go mod download

builds:
  - id: henbane
    main: ./cmd/henbane
    binary: henbane
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: henbane
    ids: [henbane]
    name_template: "henbane_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

signs:
  - id: checksum-keyless
    cmd: cosign
    # cosign v3 (installed by cosign-installer v4) writes the Sigstore bundle
    # format by default, so a single --bundle replaces the old
    # --output-signature / --output-certificate pair — the certificate is
    # embedded in the bundle, so there is nothing to point a `certificate:` at.
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

# A single dockers_v2 entry replaces the old per-arch `dockers` stanzas and the
# `docker_manifests` that stitched them together: buildx builds both platforms and
# pushes one multi-arch manifest, tagged :<version> (and :latest for stable
# releases). `tags` × `images` cross-join, so one image × two tags gives both.
dockers_v2:
  - id: henbane
    ids: [henbane]
    dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/datadir-lab/henbane"
    tags:
      - "{{ .Version }}"
      # Skip :latest on pre-releases — an empty tag is dropped, the dockers_v2
      # equivalent of the old docker_manifests `skip_push: auto`.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # Keep the pushed image a plain multi-arch manifest (no buildx SBOM/provenance
    # attestation manifests), matching prior releases: release.yml already SBOM-
    # attests and SLSA-signs the resolved image digest, and attestation manifests
    # would complicate that digest resolution.
    sbom: false
    labels:
      org.opencontainers.image.title: "henbane"
      org.opencontainers.image.source: "https://github.com/datadir-lab/henbane"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: "AGPL-3.0"

docker_signs:
  - id: image-keyless
    cmd: cosign
    # "" (the default) targets the multi-arch images built by dockers_v2 — the
    # manifest-list digest the old `artifacts: manifests` signed.
    artifacts: ""
    args: ["sign", "--yes", "${artifact}@${digest}"]
    output: true

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^(fix|perf)'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - "^Merge "

release:
  prerelease: auto
  header: |
    Henbane is an open-source, self-hostable, AGPL anti-AI-scraper gateway: it
    classifies bot traffic, then challenges it (proof-of-work), tarpits it (an
    endless labyrinth), or poisons it (corpus-grade garbage) — while verifying and
    sparing the good bots you want indexing you.

    ### Highlights
    - **Classifier** — weighted signal fusion (browser-consistency scoring) plus
      velocity, browser-hint, and a coarse TLS fingerprint. Honestly benchmarked:
      see `research/classifier-benchmark.md` for what it catches and what it can't.
    - **Verified good bots, three ways** — forward-confirmed reverse DNS
      (Googlebot/Bingbot), Web Bot Auth (RFC 9421 signed agents), and published IP
      ranges (GPTBot/ChatGPT/ClaudeBot/PerplexityBot).
    - **Four form factors** — standalone reverse proxy, embeddable `net/http`
      middleware, Caddy v2 module, and an nginx/Traefik ForwardAuth sidecar.
    - **Deterrents** — PoW challenge (Web Worker, no-JS fallback), labyrinth, four
      poison strategies, and an optional decompression bomb.
    - **Operations** — Prometheus metrics on a private listener, fail2ban output,
      and feed-based federation.

    ### Install
    - Container: `docker pull ghcr.io/datadir-lab/henbane:0.2.0`
    - Binary: download below (checksums are cosign-signed; see "Verifying releases")
    - Library: `go get github.com/datadir-lab/henbane`
    - Caddy: `xcaddy build --with github.com/datadir-lab/henbane/caddy`

    > **v0 / experimental** — the middleware API may change before 1.0. Zero
    > third-party runtime dependencies (Go stdlib + `gopkg.in/yaml.v3`).
  footer: |
    Verify this release: see "Verifying releases" in the README.
