version: 2

project_name: henbane

before:
  hooks:
    - go mod download

builds:
  - id: henbane
    main: ./cmd/henbane
    binary: henbane
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: henbane
    ids: [henbane]
    name_template: "henbane_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

signs:
  - id: checksum-keyless
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum
    output: true

dockers:
  - id: amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/datadir-lab/henbane:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=henbane"
      - "--label=org.opencontainers.image.source=https://github.com/datadir-lab/henbane"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0"
  - id: arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/datadir-lab/henbane:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=henbane"
      - "--label=org.opencontainers.image.source=https://github.com/datadir-lab/henbane"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0"

docker_manifests:
  - name_template: "ghcr.io/datadir-lab/henbane:{{ .Version }}"
    image_templates:
      - "ghcr.io/datadir-lab/henbane:{{ .Version }}-amd64"
      - "ghcr.io/datadir-lab/henbane:{{ .Version }}-arm64"
  - name_template: "ghcr.io/datadir-lab/henbane:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/datadir-lab/henbane:{{ .Version }}-amd64"
      - "ghcr.io/datadir-lab/henbane:{{ .Version }}-arm64"

docker_signs:
  - id: image-keyless
    cmd: cosign
    artifacts: manifests
    args: ["sign", "--yes", "${artifact}@${digest}"]
    output: true

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^(fix|perf)'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - "^Merge "

release:
  prerelease: auto
  footer: |
    Verify this release: see "Verifying releases" in the README.
